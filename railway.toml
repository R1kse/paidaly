[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "sh -c 'npx prisma migrate deploy && (./node_modules/.bin/tsx prisma/seed.ts || echo SEED_FAILED) && node dist/src/main'"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
